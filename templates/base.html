<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Action Dashboard</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #131722;
      --panel-border: #232838;
      --text: #e6e9f0;
      --text-dim: #8b93a7;
      --green: #2ecc71;
      --red: #e74c3c;
      --amber: #f2b134;
      --gray: #6b7280;
      --accent: #5b8def;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 32px 16px 64px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .brand {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 28px;
      font-weight: 650;
    }
    form.search {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 24px;
      line-height: 1;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; transform: translateY(1px); }
    .hint { color: var(--text-dim); font-size: 13px; margin-top: 10px; }
    .error {
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.4);
      color: #ff8f80;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
    }
    .back-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 14px; font-weight: 600; }
    .back-link:hover { color: var(--text); }

    .alert-banner {
      background: rgba(91, 141, 239, 0.12);
      border: 1px solid rgba(91, 141, 239, 0.4);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
    }
    .alert-banner a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .alert-banner a:hover { text-decoration: underline; }

    .change-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .change-card.changed { border-color: rgba(242, 177, 52, 0.5); background: rgba(242, 177, 52, 0.06); }
    .change-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .change-card .ticker { font-weight: 700; font-size: 16px; }
    .change-flow { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
    .change-flow .arrow { color: var(--text-dim); }
    .history-strip { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
    .history-dot {
      font-size: 10.5px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .action-banner {
      margin-top: 24px;
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
    }
    .action-banner .verdict {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .action-banner .reason {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 14.5px;
      line-height: 1.6;
    }
    .action-banner.pos { background: rgba(46, 204, 113, 0.10); border-color: rgba(46, 204, 113, 0.35); }
    .action-banner.pos .verdict { color: var(--green); }
    .action-banner.warn { background: rgba(242, 177, 52, 0.10); border-color: rgba(242, 177, 52, 0.35); }
    .action-banner.warn .verdict { color: var(--amber); }
    .action-banner.neg { background: rgba(231, 76, 60, 0.10); border-color: rgba(231, 76, 60, 0.35); }
    .action-banner.neg .verdict { color: var(--red); }
    .action-banner.neutral { background: rgba(107, 114, 128, 0.10); border-color: rgba(107, 114, 128, 0.35); }
    .action-banner.neutral .verdict { color: var(--text); }

    .ticker-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .ticker-row .price { color: var(--text-dim); font-size: 16px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
    }
    .card .label {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .badge.pos { background: rgba(46, 204, 113, 0.15); color: var(--green); }
    .badge.warn { background: rgba(242, 177, 52, 0.15); color: var(--amber); }
    .badge.neg { background: rgba(231, 76, 60, 0.15); color: var(--red); }
    .badge.neutral { background: rgba(107, 114, 128, 0.18); color: var(--text-dim); }
    .card .detail {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .scope-note {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--panel-border);
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Stock Action Dashboard · MVP</div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>

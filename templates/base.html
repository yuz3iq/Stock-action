<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}시그널 데스크{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='desk.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('index') }}">시그널 데스크</a>
      <nav aria-label="주 메뉴">
        {% for endpoint, label in [('index', '종목 분석'), ('changes', '신호 이력'), ('backtest', '백테스트'), ('portfolio', '자산 배분'), ('compare_risk', '위험 성향 비교'), ('trades', '매매 기록'), ('positions', '보유 종목')] %}
          <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint or (endpoint == 'index' and request.endpoint == 'analyze') %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
